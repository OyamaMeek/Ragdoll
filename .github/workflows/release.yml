name: Release macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          package-manager-cache: false

      - name: Prepare version
        run: |
          test "$(uname -m)" = arm64
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo 'Release tags must use vX.Y.Z, for example v0.1.0' >&2
              exit 1
            fi
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${GITHUB_REF_NAME#v}" packaging/Info.plist
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" packaging/Info.plist

      - name: Build application
        run: bash scripts/build.sh

      - name: Check runtime
        run: |
          npm --prefix runtime run typecheck
          node --test --test-skip-pattern='[Cc]laude' runtime/test/{acp-state,integration,logs,migration,registry}.test.ts

      - name: Test Swift
        run: swift test --disable-sandbox

      - name: Package and verify
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/Ragdoll.app dist/Ragdoll-macos-arm64.zip
          mkdir -p .agent/release-check
          ditto -x -k dist/Ragdoll-macos-arm64.zip .agent/release-check
          app=.agent/release-check/Ragdoll.app
          test -x "$app/Contents/MacOS/Ragdoll"
          test -x "$app/Contents/MacOS/RagdollService"
          test "$(lipo -archs "$app/Contents/MacOS/Ragdoll")" = arm64
          codesign --verify --deep --strict "$app"
          "$app/Contents/Resources/runtime/node/bin/node" "$app/Contents/Resources/runtime/app/dist/main.mjs" --self-check
          cd dist
          shasum -a 256 Ragdoll-macos-arm64.zip > Ragdoll-macos-arm64.zip.sha256
          shasum -a 256 -c Ragdoll-macos-arm64.zip.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: Ragdoll-macos-arm64
          path: |
            dist/Ragdoll-macos-arm64.zip
            dist/Ragdoll-macos-arm64.zip.sha256
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Ragdoll-macos-arm64.zip dist/Ragdoll-macos-arm64.zip.sha256 \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
            --notes 'macOS 15+ / Apple Silicon。包含内置 Node。当前构建使用临时签名，未经 Apple 公证，首次打开可能受到 Gatekeeper 限制；独立后台服务需要有效 Apple 签名。'
